<div class="app-shell">
  <div class="auth-buttons">
    <button type="button" class="mute-toggle" (click)="toggleMute()"
      [attr.aria-label]="isMuted() ? 'Unmute sound' : 'Mute sound'">
      {{ isMuted() ? '🔇' : '🔊' }}
    </button>
    <button *ngIf="!authService.isAuthenticated()" class="btn-discord"
      (click)="playButtonSfx(); authService.loginWithDiscord()">
      <span class="discord-icon">Discord</span>
    </button>
    <button *ngIf="authService.isAuthenticated()" class="logout" (click)="playButtonSfx(); authService.logout()">
      Logout
    </button>
  </div>

  <header class="navbar">
    <div class="nav-container">
      <div class="nav-right">
        <nav *ngIf="authService.isAuthenticated()">
          <ul class="nav-links">
            <li><a routerLink="/" routerLinkActive="active" (click)="playButtonSfx()">Home</a></li>
            <li><a routerLink="/players" routerLinkActive="active" (click)="playButtonSfx()">Players</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <router-outlet></router-outlet>
</div>
