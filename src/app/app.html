<div class="app-shell">
  <div class="auth-buttons">
    <button type="button" class="mute-toggle" (click)="toggleMute()"
      [attr.aria-label]="isMuted() ? 'Unmute sound' : 'Mute sound'">
      @if (isMuted()) {
      <mat-icon>volume_off</mat-icon>
      } @else {
      <mat-icon>volume_up</mat-icon>
      }
    </button>

    <button *ngIf="authService.isAuthenticated()" class="logout" (click)="playButtonSfx(); authService.logout()">
      Logga ut <mat-icon>exit_to_app</mat-icon>
    </button>
  </div>

  <header class="navbar">
    <div class="nav-container">
      <div class="nav-right">
        <nav class="desktop-nav" *ngIf="authService.isAuthenticated()" aria-label="Huvudmeny">
          <ul class="nav-links">
            <li><a routerLink="/" routerLinkActive="active" (click)="playButtonSfx()">Hem</a></li>
            <li><a routerLink="/players" routerLinkActive="active" (click)="playButtonSfx()">Medlemmar</a></li>
            <li><a routerLink="/party" routerLinkActive="active" (click)="playButtonSfx()">Party</a></li>
            <li><a routerLink="/botkommandon" routerLinkActive="active" ariaCurrentWhenActive="page"
                (click)="playButtonSfx()">Kommandon</a></li>
          </ul>
        </nav>
        <button *ngIf="authService.isAuthenticated()" type="button" class="mobile-menu-toggle"
          (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-navigation"
          [attr.aria-label]="mobileMenuOpen() ? 'Stäng menyn' : 'Öppna menyn'">
          <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>
      </div>
    </div>
  </header>

  <nav *ngIf="authService.isAuthenticated() && mobileMenuOpen()" id="mobile-navigation" class="mobile-nav"
    aria-label="Mobilmeny">
    <ul class="nav-links">
      <li><a routerLink="/" routerLinkActive="active" (click)="closeMobileMenu(); playButtonSfx()">Hem</a></li>
      <li><a routerLink="/players" routerLinkActive="active" (click)="closeMobileMenu(); playButtonSfx()">Medlemmar</a>
      </li>
      <li><a routerLink="/party" routerLinkActive="active" (click)="closeMobileMenu(); playButtonSfx()">Party</a></li>
      <li><a routerLink="/botkommandon" routerLinkActive="active" ariaCurrentWhenActive="page"
          (click)="closeMobileMenu(); playButtonSfx()">Kommandon</a></li>
    </ul>
  </nav>

  <app-announcement-banner></app-announcement-banner>

  <router-outlet></router-outlet>

  <img
    *ngIf="mascotVisible()"
    class="mascot-runner"
    src="IKEAMUSHDAD.gif"
    alt=""
    aria-hidden="true"
    (animationend)="onMascotAnimationEnd()"
  >
</div>
