<div class="app-shell">
  <div class="top-bar">
    <nav class="desktop-nav" *ngIf="authService.isAuthenticated()" aria-label="Huvudmeny">
      <ul class="nav-links">
        <li><a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="playButtonSfx()">Hem</a></li>
        <li><a routerLink="/players" routerLinkActive="active" (click)="playButtonSfx()">Medlemmar</a></li>
        <li><a routerLink="/party" routerLinkActive="active" (click)="playButtonSfx()">Party</a></li>
        <li><a routerLink="/topplistan" routerLinkActive="active" (click)="playButtonSfx()">Topplistan</a></li>
        <li><a routerLink="/info" routerLinkActive="active" ariaCurrentWhenActive="page"
            (click)="playButtonSfx()">Info</a></li>
        <li><a routerLink="/patchnotes" routerLinkActive="active" ariaCurrentWhenActive="page"
            (click)="playButtonSfx()">Patchnotes</a></li>
      </ul>
    </nav>

    <button type="button" class="mobile-menu-toggle" (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-navigation"
      [attr.aria-label]="mobileMenuOpen() ? 'Stäng menyn' : 'Öppna menyn'">
      <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>

    <div class="auth-buttons desktop-auth">
      <button type="button" class="mute-toggle" (click)="toggleMute()"
        [attr.aria-label]="isMuted() ? 'Unmute sound' : 'Mute sound'">
        @if (isMuted()) {
        <mat-icon>volume_off</mat-icon>
        } @else {
        <mat-icon>volume_up</mat-icon>
        }
      </button>

      <button *ngIf="authService.isAuthenticated()" class="logout" (click)="playButtonSfx(); authService.logout()">
        Logga ut <mat-icon>exit_to_app</mat-icon>
      </button>
    </div>

    <nav *ngIf="mobileMenuOpen()" id="mobile-navigation" class="mobile-nav" aria-label="Mobilmeny">
      <ul class="nav-links" *ngIf="authService.isAuthenticated()">
        <li><a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu(); playButtonSfx()">Hem</a></li>
        <li><a routerLink="/players" routerLinkActive="active" (click)="closeMobileMenu(); playButtonSfx()">Medlemmar</a>
        </li>
        <li><a routerLink="/party" routerLinkActive="active" (click)="closeMobileMenu(); playButtonSfx()">Party</a></li>
        <li><a routerLink="/topplistan" routerLinkActive="active" (click)="closeMobileMenu(); playButtonSfx()">Topplistan</a></li>
        <li><a routerLink="/info" routerLinkActive="active" ariaCurrentWhenActive="page"
            (click)="closeMobileMenu(); playButtonSfx()">Info</a></li>
        <li><a routerLink="/patchnotes" routerLinkActive="active" ariaCurrentWhenActive="page"
            (click)="closeMobileMenu(); playButtonSfx()">Patchnotes</a></li>
      </ul>

      <div class="auth-buttons mobile-auth">
        <button type="button" class="mute-toggle" (click)="toggleMute()"
          [attr.aria-label]="isMuted() ? 'Unmute sound' : 'Mute sound'">
          <mat-icon>{{ isMuted() ? 'volume_off' : 'volume_up' }}</mat-icon>
          {{ isMuted() ? 'Ljud på' : 'Ljud av' }}
        </button>

        <button *ngIf="authService.isAuthenticated()" class="logout"
          (click)="closeMobileMenu(); playButtonSfx(); authService.logout()">
          Logga ut <mat-icon>exit_to_app</mat-icon>
        </button>
      </div>
    </nav>
  </div>

  <header class="navbar">
    <div class="nav-container"></div>
  </header>

  <app-announcement-banner></app-announcement-banner>

  <router-outlet></router-outlet>

  <img
    *ngIf="mascotVisible()"
    class="mascot-runner"
    src="IKEAMUSHDAD.gif"
    alt=""
    aria-hidden="true"
    (animationend)="onMascotAnimationEnd()"
  >
</div>
